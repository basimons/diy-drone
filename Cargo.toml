[workspace]
resolver = "3"
members = ["common", "link", "client", "fc"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
drone-common = { path = "common" }
drone-link = { path = "link" }
anyhow = "1"

[workspace.lints.clippy]
# House style: every function and closure ends with an explicit `return`.
implicit_return = "warn"
needless_return = "allow"
